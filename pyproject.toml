[build-system]
requires = ["setuptools >= 61.0", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dissectBCL"
description = "demuliplexing illumina data"
readme = "README.md"
dynamic = ["version"]
keywords = ["demultiplexing", "illumina"]
authors = [
  {name = "WardDeb", email = 'w@rddeboutte.com'},
  {name = "Bioinfo-Core MPI-IE"}
]
requires-python = ">=3.10"
dependencies = [
  "rich-click",
  "ruamel.yaml",
  "tabulate",
  "dominate",
  "interop"
]
[project.optional-dependencies]
dev = [
  "ruff",
  "pytest",
  "pytest-datafiles",
  "pandas",
  "biopython"
]
docs = [
  "sphinx>=7.2.6",
  "sphinx_rtd_theme>=2.0.0"
]
[project.scripts]
dissect = "dissectBCL.dissect:dissect"
wd40 = "wd40.wd40:cli"
email = "tools.emailProjectFinished:main"
contam = "tools.prep_contaminome:main"

[tool.setuptools_scm]

[tool.ruff]
exclude = [
  "docs",
  "tests"
]

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]
extend-safe-fixes = [
    # Comparison to `None` should be `cond is None`
    "E711",
    # Avoid equality comparisons to `True`
    "E712",
]
ignore = [
    # Line too long
    "E501",
]

[tool.codespell]
# ser: pandas Series variable; testser: test helper name (testSer).
ignore-words-list = "ser,testser"
# CHANGELOG.md is generated by release-please from commit messages; don't
# police its wording (avoids the hook fighting release bot PRs). build/ is a
# build artifact.
skip = "./CHANGELOG.md,./build"
